# ── User Service Deployment ──
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: url-shortener
spec:
  replicas: 2
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: url-shortener/user-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          # startupProbe protects slow JVM boot — liveness won't fire until this passes
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30  # 30 × 6s = 3 min max startup window
            periodSeconds: 6
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 0
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: url-shortener
spec:
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081
---

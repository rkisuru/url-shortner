global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway:8080"]
        labels:
          service: "api-gateway"

  - job_name: "url-api"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["url-api:8082"]
        labels:
          service: "url-api"

  - job_name: "user-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["user-service:8081"]
        labels:
          service: "user-service"
